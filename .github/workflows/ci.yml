name: Source security and Windows host

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  ASTER_DISABLE_LIVE: '1'

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked source for probable credentials
        run: |
          git rev-parse HEAD
          python3 scripts/ci/scan_secrets.py --self-test
          python3 scripts/ci/scan_secrets.py
      - name: Require reproducible dependency inputs
        run: |
          test -s pnpm-lock.yaml
          python3 -m json.tool docs/aster-builder/contract.json > /dev/null
          python3 -I scripts/ci/verify_vendored_sources.py --self-test
          python3 -I scripts/ci/verify_vendored_sources.py --root .
      - name: Require aligned locked Tauri API and Rust versions
        run: |
          python3 -I scripts/ci/check_tauri_versions.py --self-test
          python3 -I scripts/ci/check_tauri_versions.py --root .
      - name: Require the reviewed WinRT async ABI cohort
        run: |
          python3 -I scripts/ci/check_winrt_versions.py --self-test
          python3 -I scripts/ci/check_winrt_versions.py --root .
      - name: Reject forged or incomplete CPU containment receipts
        run: python3 -I scripts/ci/verify_cpu_receipt.py --self-test

  frontend:
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install exact locked dependencies
        run: |
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile
      - name: Static checks and fixture tests
        run: |
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build
      - name: Dependency advisory gate
        run: corepack pnpm audit --audit-level moderate
      - name: Capture license inventory and frontend SBOM
        run: |
          mkdir -p reports
          printf '%s\n' "$(git rev-parse HEAD)" > reports/source-revision.txt
          corepack pnpm licenses list --json > reports/frontend-licenses.json
          corepack pnpm sbom --sbom-format cyclonedx > reports/frontend.cdx.json
          python3 -m json.tool reports/frontend-licenses.json > /dev/null
          python3 -m json.tool reports/frontend.cdx.json > /dev/null
          sha256sum reports/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error

  codec-source-fixtures:
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact production codec module with closed synthetic fixtures
        run: |
          git rev-parse HEAD
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 test --manifest-path scripts/qa/codec-fixtures/Cargo.toml --locked
          cargo +1.97.0 test --manifest-path scripts/qa/zune-unit-fixtures/Cargo.toml --locked --lib --no-default-features --features std

  windows-host:
    needs: [source-policy, frontend, codec-source-fixtures]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require a committed Rust lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock -PathType Leaf) -or (Get-Item src-tauri/Cargo.lock).Length -eq 0) { throw 'Commit reviewed nonempty src-tauri/Cargo.lock before Windows CI.' }
      - name: Build renderer for the Windows host
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record actual hosted execution context
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $revision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA) { throw 'Hosted fixture source identity changed.' }
          [ordered]@{
            classification = 'hosted-source-fixtures-not-owner-session'
            source_revision = $revision
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            principal = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            os_version = [System.Environment]::OSVersion.VersionString
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Tee-Object -FilePath reports/windows-execution-context.json
      - name: Generate locked source notices for bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python scripts/ci/third_party_notices.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked | Set-Content reports/packaging-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked --filter-platform x86_64-pc-windows-msvc | Set-Content reports/packaging-metadata-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/third_party_notices.py reports/packaging-metadata.json reports/packaging-metadata-windows.json . reports/THIRD-PARTY-NOTICES.txt reports/third-party-notice-inventory.json x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect fixture drive eligibility
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class AsterDriveDiagnostic {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern uint QueryDosDevice(string name, StringBuilder target, uint capacity);
          }
          '@
          foreach ($candidate in @($env:LOCALAPPDATA, [System.IO.Path]::GetTempPath())) {
            if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
            $root = [System.IO.Path]::GetPathRoot($candidate)
            $drive = [System.IO.DriveInfo]::new($root)
            Write-Host ("Native fixture candidate root={0}; drive type={1}; filesystem={2}; ready={3}" -f $root, $drive.DriveType, $drive.DriveFormat, $drive.IsReady)
            $device = [System.Text.StringBuilder]::new(512)
            $units = [AsterDriveDiagnostic]::QueryDosDevice($root.Substring(0, 2), $device, 512)
            if ($units -eq 0) { throw "Cannot read DOS mapping for fixture drive $root" }
            Write-Host ("DOS mapping: {0}" -f $device.ToString().Split([char]0)[0])
            $item = Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            while ($null -ne $item) {
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { Write-Host ("Reparse ancestor: {0}" -f $item.FullName) }
              $item = $item.Parent
            }
          }
      - name: Check pure installer provenance and resource contracts
        shell: pwsh
        run: |
          ./scripts/qa/Test-InstallerProvenanceContract.ps1 | Tee-Object -FilePath reports/installer-provenance-contract.json
          if (-not $?) { throw 'Pure installer provenance contract failed.' }
          ./scripts/qa/Test-AsterBuilderResourceContract.ps1 | Tee-Object -FilePath reports/installer-resource-contract.json
          if (-not $?) { throw 'Pure installer resource contract failed.' }
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check all Rust targets
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deny Rust Clippy warnings
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete Rust fixture suite
        id: complete-rust-fixtures
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose exact synthetic PDF library case after full-suite failure
        if: ${{ failure() && steps.complete-rust-fixtures.outcome == 'failure' }}
        shell: pwsh
        timeout-minutes: 2
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/qa/run_pdf_library_crash_diagnostic.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/qa/run_pdf_library_crash_diagnostic.py --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run owner-authorised disposable synthetic credential fixtures
        shell: pwsh
        run: |
          # Owner approval on 4 October 2026 is limited to these two existing
          # fixtures on this ephemeral hosted runner, never the owner's laptop.
          # Production target/key/Meta and normal app bootstrap are not entered.
          $credentialCases = @(
            'credential::native::tests::synthetic_credential_round_trip_uses_a_disposable_target'
            'credential::native::tests::malformed_stored_blobs_are_not_configured_on_a_disposable_target'
          )
          $credentialResults = @()
          foreach ($credentialCase in $credentialCases) {
            $started = (Get-Date).ToUniversalTime().ToString('o')
            $testOutput = @(& cargo test --manifest-path src-tauri/Cargo.toml --locked --lib $credentialCase -- --ignored --exact --test-threads=1 2>&1)
            $testExit = $LASTEXITCODE
            $testOutput | Write-Output
            $textOutput = ($testOutput | ForEach-Object { [string]$_ }) -join "`n"
            if ($testExit -ne 0 -or
                $textOutput -cnotmatch '(?m)^running 1 test\r?$' -or
                $textOutput -cnotmatch ('(?m)^test ' + [regex]::Escape($credentialCase) + ' \.\.\. ok\r?$') -or
                $textOutput -cnotmatch '(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored;') {
              throw 'Exact disposable credential fixture did not execute and pass.'
            }
            $credentialResults += [ordered]@{
              case = $credentialCase
              status = 'PASS'
              started_at_utc = $started
              completed_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            }
          }
          $revision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA -or $credentialResults.Count -ne 2) { throw 'Disposable credential source/case binding changed.' }
          [ordered]@{
            classification = 'hosted-disposable-synthetic-credential-fixtures-not-owner-session'
            source_revision = $revision
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            principal = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            os_version = [System.Environment]::OSVersion.VersionString
            real_credential_target_used = $false
            owner_laptop_used = $false
            app_bootstrap_entered = $false
            live_meta_called = $false
            cases = $credentialResults
          } | ConvertTo-Json -Depth 5 | Tee-Object -FilePath reports/native-synthetic-credential-fixture.json
      - name: RustSec advisory gate
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo audit --file src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture Rust dependency and license SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $sourceRevision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceRevision | Set-Content -Path reports/source-revision.txt
          $metadata = & cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata | Set-Content -Path reports/rust-metadata.json
          python scripts/ci/cargo_sbom.py reports/rust-metadata.json reports/rust.cdx.json reports/rust-licenses.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item reports/rust-metadata.json
          Get-FileHash reports/* -Algorithm SHA256 | Format-Table Path,Hash -AutoSize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && hashFiles('reports/windows-execution-context.json') != '' }}
        with:
          name: windows-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error

  engineering-installer:
    needs: [source-policy, frontend, windows-host]
    if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Restore exact frontend and pinned Rust inputs
        shell: pwsh
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.97.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record actual installer diagnostic execution context
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $revision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA) { throw 'Installer diagnostic source identity changed.' }
          [ordered]@{
            classification = 'hosted-package-diagnostics-not-owner-session'
            source_revision = $revision
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            principal = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            os_version = [System.Environment]::OSVersion.VersionString
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Tee-Object -FilePath reports/installer-execution-context.json
      - name: Build unsigned NSIS engineering package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python scripts/ci/third_party_notices.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked | Set-Content reports/packaging-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked --filter-platform x86_64-pc-windows-msvc | Set-Content reports/packaging-metadata-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/third_party_notices.py reports/packaging-metadata.json reports/packaging-metadata-windows.json . reports/THIRD-PARTY-NOTICES.txt reports/third-party-notice-inventory.json x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm exec tauri build --ci --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Synthetic pre-bootstrap checks only: no GUI, owner stores, key,
          # Meta endpoint or normal application startup is entered.
          # Release uses the Windows GUI subsystem. A terminal unredirected
          # native command may return before exit in PowerShell, closing its
          # stdout pipe. An explicit consumer keeps capture alive until exit;
          # preserve the actual native exit and all fifteen/six strict checks.
          $diagnostic = @(& .\src-tauri\target\release\aster-desktop.exe --aster-attachment-fixture | ForEach-Object { $_ })
          $diagnosticExit = $LASTEXITCODE
          $diagnostic | Set-Content -LiteralPath reports/attachment-worker-fixture.json -Encoding utf8NoBOM
          $diagnostic | Write-Output
          if ($diagnosticExit -ne 0) { throw 'Synthetic native attachment/Job fixture failed; retain report without promoting the package.' }
          $diagnosticReport = ($diagnostic -join "`n") | ConvertFrom-Json
          if ($diagnosticReport.schemaVersion -ne 1 -or -not $diagnosticReport.allPassed -or $diagnosticReport.cases.Count -ne 15 -or $diagnosticReport.resourceKillChecks.Count -ne 6) { throw 'Unexpected native attachment fixture receipt.' }
          if (@($diagnosticReport.cases | Where-Object { $_.status -cne 'PASS' }).Count -ne 0 -or @($diagnosticReport.resourceKillChecks | Where-Object { $_.status -cne 'PASS' }).Count -ne 0) { throw 'Every codec and resource case requires an independently observed PASS.' }
          python -I scripts/ci/verify_cpu_receipt.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/ci/verify_cpu_receipt.py --receipt reports/attachment-worker-fixture.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent causal CPU receipt validation failed; package promotion denied.' }
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency inputs changed during the build.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed during the build.' }
          $unexpectedSource = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $unexpectedSource.Count -ne 0) { throw 'Checkout contains changed or untracked non-ignored source after the build.' }
          $candidates = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe' -ErrorAction Stop)
          if ($candidates.Count -ne 1 -or $candidates[0].Length -le 0) { throw 'Expected exactly one nonempty NSIS setup executable.' }
          $installer = $candidates[0]
          if ($installer.Name -cne 'Aster Desktop_0.2.4_x64-setup.exe') { throw 'NSIS installer filename/version/architecture is not the reviewed engineering-package identity.' }
          function Get-AsterBuilderResourceInventory {
            # Exact original inert ZIP-member identities; no manifest-defined replacements.
            return [ordered]@{
              'aster-builder/SKILL.md' = @{ byte_count=7329; sha256='4a2eb40201f49ac4dee89cfd08852b4f764c44e770d90bee2d4dd18847773c71' }
              'aster-builder/references/architecture.md' = @{ byte_count=2240; sha256='f1835a20299004b83318d9ebb068a909deee02a8518af4dcecaad77b22dc7f10' }
              'aster-builder/references/spec-threats.md' = @{ byte_count=1677; sha256='0a5c611e7508d9d13251f97a682afa4fc8a382c8966b511f5b0d537ef3ab3cfd' }
              'aster-builder/references/provider-contracts.md' = @{ byte_count=1655; sha256='675b3443e9005a559d4d5d719121aac3cbd826929c1508646db8f98577b6f294' }
              'aster-builder/references/storage-tools.md' = @{ byte_count=1481; sha256='46b01b2fb5dd3a8adb00cafad6d71e92e188dfd30c6e40bcf6fdb8ea24db9ac9' }
              'aster-builder/references/ui.md' = @{ byte_count=1613; sha256='c22cfa4a62ddf334f3b3b9a24f46b5d755c4cddcb4204d758c0e548e9548720a' }
              'aster-builder/references/verification.md' = @{ byte_count=2256; sha256='ef0e3c086f350c2b9ef629f087c4a80f66de308f7efd97fb5ca61ec1f4a534bf' }
              'aster-builder/references/aster-case-study.md' = @{ byte_count=1160; sha256='31e868a022e71c84fa2bd0418a2ff621c597fc576bdd056fc90be303afadaf3a' }
              'aster-builder/references/ledger-schema.md' = @{ byte_count=4172; sha256='d322712e3d4614827248aceed46ff82ac126501e60f805ba94a68a86191dd591' }
              'aster-builder/assets/icon.svg' = @{ byte_count=1738; sha256='8936b24f674a1250d999e2c2b5901374fb4240426f32bd1ae340c352a90d617d' }
            }
          }
          function Assert-RequiredResourceMembers([object[]]$Members, $ExpectedSizes) {
            $names = @($ExpectedSizes.Keys)
            $seen = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::Ordinal)
            foreach ($member in $Members) {
              $path = ([string]$member.Path).Replace('\', '/')
              $parts = @($path.Split('/'))
              $leaf = $parts[$parts.Count - 1]
              $isBuilder = @($parts | Where-Object { [string]::Equals($_.TrimEnd(' ', '.'), 'aster-builder', [System.StringComparison]::OrdinalIgnoreCase) }).Count -gt 0
              $isResource = $isBuilder -or $leaf.TrimEnd(' ', '.') -in @('THIRD-PARTY-NOTICES.txt', 'LICENSE.txt')
              if (-not $isResource) { continue }
              if ($names -cnotcontains $path -or -not $seen.Add($path)) { throw 'Installer resource namespace contains an unknown, aliased or duplicate member.' }
              if ([long]$member.Size -ne [long]$ExpectedSizes[$path]) { throw 'Installer resource member length differs from the fixed inventory.' }
            }
            if ($seen.Count -ne $names.Count) { throw 'Installer resource inventory is incomplete.' }
          }
          $builderInventory = Get-AsterBuilderResourceInventory
          $expectedMappings = [ordered]@{
            '../reports/THIRD-PARTY-NOTICES.txt' = 'THIRD-PARTY-NOTICES.txt'
            '../LICENSE' = 'LICENSE.txt'
          }
          foreach ($name in $builderInventory.Keys) { $expectedMappings['resources/' + $name] = $name }
          $configMappings = @((Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).bundle.resources.PSObject.Properties)
          if ($configMappings.Count -ne $expectedMappings.Count) { throw 'Bundle resource config mapping set is not exact.' }
          foreach ($mapping in $configMappings) {
            if (@($expectedMappings.Keys) -cnotcontains $mapping.Name -or [string]$mapping.Value -cne [string]$expectedMappings[$mapping.Name]) { throw 'Bundle resource source/destination mapping is not an exact reviewed pair.' }
          }
          $resourceHashes = [ordered]@{}
          $resourceByteCounts = [ordered]@{}
          foreach ($sourceName in $expectedMappings.Keys) {
            $name = $expectedMappings[$sourceName]
            $sourcePath = Join-Path src-tauri $sourceName
            $sourceItem = Get-Item -LiteralPath $sourcePath -Force -ErrorAction Stop
            if ($sourceItem.PSIsContainer -or ($sourceItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 -or $sourceItem.Length -le 0 -or $sourceItem.Length -gt 268435456) { throw 'Bundle resource source is not a normal bounded nonempty file.' }
            $hash = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($builderInventory.Contains($name) -and ($sourceItem.Length -ne $builderInventory[$name].byte_count -or $hash -cne $builderInventory[$name].sha256)) { throw 'Original inert Aster Builder source byte identity changed.' }
            $resourceHashes[$name] = $hash
            $resourceByteCounts[$name] = [long]$sourceItem.Length
          }
          $sevenZip = Get-Command 7z.exe -ErrorAction Stop
          $rawPayloadList = Join-Path $env:RUNNER_TEMP 'aster-installer-payload-list-raw.txt'
          $payloadListing = @(& $sevenZip.Source l -slt -ba $installer.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload listing failed.' }
          $entryCount = 0
          [long]$preflightBytes = 0
          $currentPath = $null
          $currentSize = $null
          $payloadMembers = New-Object 'System.Collections.Generic.List[object]'
          foreach ($line in @($payloadListing) + '') {
            if ([string]::IsNullOrWhiteSpace([string]$line)) {
              if ($null -ne $currentPath) {
                [long]$parsedSize = 0
                if ($null -eq $currentSize -or -not [long]::TryParse([string]$currentSize, [ref]$parsedSize) -or $parsedSize -lt 0 -or $parsedSize -gt 268435456) { throw 'Installer payload member size is invalid or exceeds 256 MiB.' }
                $normalized = ([string]$currentPath).Replace('/', '\')
                if ($normalized.Length -eq 0 -or $normalized.Length -gt 4096 -or [System.IO.Path]::IsPathRooted($normalized) -or $normalized.StartsWith('\') -or $normalized -match ':' -or $normalized -match '(^|\\)\.{1,2}(\\|$)') { throw 'Installer payload member path is unsafe.' }
                if ($preflightBytes -gt 536870912 - $parsedSize) { throw 'Installer payload exceeds the 512 MiB expanded-size bound.' }
                $preflightBytes += $parsedSize
                $entryCount++
                if ($entryCount -gt 8192) { throw 'Installer payload has too many members.' }
                $payloadMembers.Add([pscustomobject]@{ Path=$normalized.Replace('\', '/'); Size=$parsedSize })
                $currentPath = $null
                $currentSize = $null
              }
              continue
            }
            if ([string]$line -clike 'Path = *') { $currentPath = ([string]$line).Substring(7); continue }
            if ([string]$line -clike 'Size = *') { $currentSize = ([string]$line).Substring(7); continue }
            if ([string]$line -clike 'Anti = +*' -or [string]$line -clike 'Symbolic Link = *' -or [string]$line -clike 'Hard Link = *') { throw 'Installer payload contains a link or anti-item.' }
          }
          if ($entryCount -eq 0) { throw 'Installer payload listing contains no members.' }
          Assert-RequiredResourceMembers $payloadMembers.ToArray() $resourceByteCounts
          $payloadListing | Set-Content -LiteralPath $rawPayloadList -Encoding utf8
          $payloadRoot = Join-Path $env:RUNNER_TEMP ("aster-installer-payload-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $payloadRoot) { throw 'Fresh installer payload extraction directory already exists.' }
          New-Item -ItemType Directory -Path $payloadRoot -ErrorAction Stop | Out-Null
          & $sevenZip.Source x $installer.FullName "-o$payloadRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload extraction failed.' }
          $payloadItems = @(Get-ChildItem -LiteralPath $payloadRoot -Recurse -Force)
          if (@($payloadItems | Where-Object { ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) { throw 'Extracted installer payload contains a link/reparse point.' }
          # NSIS advertises encoded patch bytes for uninstall.exe, not its
          # reconstructed executable length. Enforce actual member bounds too.
          if (@($payloadItems | Where-Object { -not $_.PSIsContainer -and $_.Length -gt 268435456 }).Count -ne 0) { throw 'Extracted installer payload member exceeds 256 MiB.' }
          $expandedBytes = @($payloadItems | Where-Object { -not $_.PSIsContainer } | Measure-Object -Property Length -Sum).Sum
          if ([long]$expandedBytes -gt 536870912) { throw 'Extracted installer payload exceeds the 512 MiB expanded-size bound.' }
          $extractedMembers = @($payloadItems | Where-Object { -not $_.PSIsContainer } | ForEach-Object {
            [pscustomobject]@{ Path=$_.FullName.Substring($payloadRoot.Length + 1).Replace('\', '/'); Size=$_.Length }
          })
          Assert-RequiredResourceMembers $extractedMembers $resourceByteCounts
          foreach ($name in $resourceHashes.Keys) {
            $resourcePath = Join-Path $payloadRoot $name
            if ((Get-FileHash -LiteralPath $resourcePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $resourceHashes[$name]) { throw 'Extracted bundle resource hash differs from the exact reviewed source.' }
          }
          $payloadHeader = @(
            'classification=verified-extracted-nsis-payload'
            'required_resource_count=12'
            'aster_builder_resource_count=10'
            "preflight_entry_count=$entryCount"
            "preflight_total_bytes=$preflightBytes"
            "extracted_file_bytes=$expandedBytes"
          )
          foreach ($name in $resourceHashes.Keys) {
            $payloadHeader += "$name.sha256=$($resourceHashes[$name])"
            $payloadHeader += "$name.byte_count=$($resourceByteCounts[$name])"
          }
          $payloadHeader += '--- 7z listing follows ---'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'reports/installer-payload-list.txt'), $payloadHeader, $utf8NoBom)
          [System.IO.File]::AppendAllText((Join-Path $PWD 'reports/installer-payload-list.txt'), [System.IO.File]::ReadAllText($rawPayloadList), $utf8NoBom)
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected installer signature status: $($signature.Status)" }
          New-Item -ItemType Directory -Force reports/engineering-installer | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination reports/engineering-installer -ErrorAction Stop
          Copy-Item reports/THIRD-PARTY-NOTICES.txt,reports/third-party-notice-inventory.json,reports/installer-payload-list.txt -Destination reports/engineering-installer -ErrorAction Stop
          $revision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Checked-out source revision changed.' }
          $packageClassification = 'unsigned-engineering-candidate'
          if ($env:GITHUB_REF -ceq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -cin @('push', 'workflow_dispatch')) {
            $packageClassification = 'unsigned-engineering-build'
          }
          $details = [ordered]@{
            classification = $packageClassification
            workflow_ref = $env:GITHUB_REF
            workflow_event = $env:GITHUB_EVENT_NAME
            source_revision = $revision
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            filename = $installer.Name
            byte_count = $installer.Length
            sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            authenticode_status = [string]$signature.Status
            bundle_resource_sha256 = $resourceHashes
            bundle_resource_byte_count = $resourceByteCounts
            evidence_sha256 = [ordered]@{
              'THIRD-PARTY-NOTICES.txt' = (Get-FileHash reports/THIRD-PARTY-NOTICES.txt -Algorithm SHA256).Hash.ToLowerInvariant()
              'third-party-notice-inventory.json' = (Get-FileHash reports/third-party-notice-inventory.json -Algorithm SHA256).Hash.ToLowerInvariant()
              'installer-payload-list.txt' = (Get-FileHash reports/installer-payload-list.txt -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            runner = $env:RUNNER_OS
            principal = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            os_version = [System.Environment]::OSVersion.VersionString
            rustc_version = (& rustc --version)
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $details | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath reports/engineering-installer/manifest.json -Encoding utf8
          if ((Get-Item -LiteralPath reports/engineering-installer/manifest.json).Length -gt 16384) { throw 'Installer manifest exceeds the existing passive 16-KiB bound.' }
          Get-Content -LiteralPath reports/engineering-installer/manifest.json
      - name: Preserve synthetic attachment diagnostics even on failure
        if: ${{ always() && hashFiles('reports/installer-execution-context.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attachment-worker-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/installer-execution-context.json
            reports/attachment-worker-fixture.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UNSIGNED-engineering-aster-desktop-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/engineering-installer/
          retention-days: 14
          if-no-files-found: error
