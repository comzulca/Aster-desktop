name: Source security and Windows host

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  ASTER_DISABLE_LIVE: '1'

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked source for probable credentials
        run: |
          git rev-parse HEAD
          python3 scripts/ci/scan_secrets.py --self-test
          python3 scripts/ci/scan_secrets.py
      - name: Require reproducible dependency inputs
        run: |
          test -s pnpm-lock.yaml
          python3 -m json.tool docs/aster-builder/contract.json > /dev/null
      - name: Require aligned locked Tauri API and Rust versions
        run: |
          python3 -I scripts/ci/check_tauri_versions.py --self-test
          python3 -I scripts/ci/check_tauri_versions.py --root .

  frontend:
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install exact locked dependencies
        run: |
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile
      - name: Static checks and fixture tests
        run: |
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build
      - name: Dependency advisory gate
        run: corepack pnpm audit --audit-level moderate
      - name: Capture license inventory and frontend SBOM
        run: |
          mkdir -p reports
          printf '%s\n' "$(git rev-parse HEAD)" > reports/source-revision.txt
          corepack pnpm licenses list --json > reports/frontend-licenses.json
          corepack pnpm sbom --sbom-format cyclonedx > reports/frontend.cdx.json
          python3 -m json.tool reports/frontend-licenses.json > /dev/null
          python3 -m json.tool reports/frontend.cdx.json > /dev/null
          sha256sum reports/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error

  windows-host:
    needs: [source-policy, frontend]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require a committed Rust lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock -PathType Leaf) -or (Get-Item src-tauri/Cargo.lock).Length -eq 0) { throw 'Commit reviewed nonempty src-tauri/Cargo.lock before Windows CI.' }
      - name: Build renderer for the Windows host
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate locked source notices for bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python scripts/ci/third_party_notices.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked | Set-Content reports/packaging-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked --filter-platform x86_64-pc-windows-msvc | Set-Content reports/packaging-metadata-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/third_party_notices.py reports/packaging-metadata.json reports/packaging-metadata-windows.json . reports/THIRD-PARTY-NOTICES.txt reports/third-party-notice-inventory.json x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect fixture drive eligibility
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class AsterDriveDiagnostic {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern uint QueryDosDevice(string name, StringBuilder target, uint capacity);
          }
          '@
          foreach ($candidate in @($env:LOCALAPPDATA, [System.IO.Path]::GetTempPath())) {
            if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
            $root = [System.IO.Path]::GetPathRoot($candidate)
            $drive = [System.IO.DriveInfo]::new($root)
            Write-Host ("Native fixture candidate root={0}; drive type={1}; filesystem={2}; ready={3}" -f $root, $drive.DriveType, $drive.DriveFormat, $drive.IsReady)
            $device = [System.Text.StringBuilder]::new(512)
            $units = [AsterDriveDiagnostic]::QueryDosDevice($root.Substring(0, 2), $device, 512)
            if ($units -eq 0) { throw "Cannot read DOS mapping for fixture drive $root" }
            Write-Host ("DOS mapping: {0}" -f $device.ToString().Split([char]0)[0])
            $item = Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            while ($null -ne $item) {
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { Write-Host ("Reparse ancestor: {0}" -f $item.FullName) }
              $item = $item.Parent
            }
          }
      - name: Rust formatting, static checks and fixture tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: RustSec advisory gate
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo audit --file src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture Rust dependency and license SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $sourceRevision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceRevision | Set-Content -Path reports/source-revision.txt
          $metadata = & cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata | Set-Content -Path reports/rust-metadata.json
          python scripts/ci/cargo_sbom.py reports/rust-metadata.json reports/rust.cdx.json reports/rust-licenses.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item reports/rust-metadata.json
          Get-FileHash reports/* -Algorithm SHA256 | Format-Table Path,Hash -AutoSize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error

  engineering-installer:
    needs: [source-policy, frontend, windows-host]
    if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Restore exact frontend and pinned Rust inputs
        shell: pwsh
        run: |
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.97.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned NSIS engineering package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python scripts/ci/third_party_notices.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked | Set-Content reports/packaging-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --locked --filter-platform x86_64-pc-windows-msvc | Set-Content reports/packaging-metadata-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/third_party_notices.py reports/packaging-metadata.json reports/packaging-metadata-windows.json . reports/THIRD-PARTY-NOTICES.txt reports/third-party-notice-inventory.json x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm exec tauri build --ci --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Synthetic pre-bootstrap checks only: no GUI, owner stores, key,
          # Meta endpoint or normal application startup is entered.
          $diagnostic = @(& .\src-tauri\target\release\aster-desktop.exe --aster-attachment-fixture)
          $diagnosticExit = $LASTEXITCODE
          $diagnostic | Set-Content -LiteralPath reports/attachment-worker-fixture.json -Encoding utf8NoBOM
          $diagnostic | Write-Output
          if ($diagnosticExit -ne 0) { throw 'Synthetic native attachment/Job fixture failed; retain report without promoting the package.' }
          $diagnosticReport = ($diagnostic -join "`n") | ConvertFrom-Json
          if ($diagnosticReport.schemaVersion -ne 1 -or -not $diagnosticReport.allPassed -or $diagnosticReport.cases.Count -ne 15 -or $diagnosticReport.resourceKillChecks.Count -ne 6) { throw 'Unexpected native attachment fixture receipt.' }
          if (@($diagnosticReport.cases | Where-Object { $_.status -cne 'PASS' }).Count -ne 0 -or @($diagnosticReport.resourceKillChecks | Where-Object { $_.status -cne 'PASS' }).Count -ne 0) { throw 'Every codec and resource case requires an independently observed PASS.' }
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency inputs changed during the build.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed during the build.' }
          $unexpectedSource = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $unexpectedSource.Count -ne 0) { throw 'Checkout contains changed or untracked non-ignored source after the build.' }
          $candidates = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe' -ErrorAction Stop)
          if ($candidates.Count -ne 1 -or $candidates[0].Length -le 0) { throw 'Expected exactly one nonempty NSIS setup executable.' }
          $installer = $candidates[0]
          if ($installer.Name -cne 'Aster Desktop_0.2.3_x64-setup.exe') { throw 'NSIS installer filename/version/architecture is not the reviewed engineering-package identity.' }
          $sevenZip = Get-Command 7z.exe -ErrorAction Stop
          $rawPayloadList = Join-Path $env:RUNNER_TEMP 'aster-installer-payload-list-raw.txt'
          $payloadListing = @(& $sevenZip.Source l -slt -ba $installer.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload listing failed.' }
          $entryCount = 0
          [long]$preflightBytes = 0
          $currentPath = $null
          $currentSize = $null
          foreach ($line in @($payloadListing) + '') {
            if ([string]::IsNullOrWhiteSpace([string]$line)) {
              if ($null -ne $currentPath) {
                [long]$parsedSize = 0
                if ($null -eq $currentSize -or -not [long]::TryParse([string]$currentSize, [ref]$parsedSize) -or $parsedSize -lt 0 -or $parsedSize -gt 268435456) { throw 'Installer payload member size is invalid or exceeds 256 MiB.' }
                $normalized = ([string]$currentPath).Replace('/', '\')
                if ($normalized.Length -eq 0 -or $normalized.Length -gt 4096 -or [System.IO.Path]::IsPathRooted($normalized) -or $normalized.StartsWith('\') -or $normalized -match ':' -or $normalized -match '(^|\\)\.{1,2}(\\|$)') { throw 'Installer payload member path is unsafe.' }
                if ($preflightBytes -gt 536870912 - $parsedSize) { throw 'Installer payload exceeds the 512 MiB expanded-size bound.' }
                $preflightBytes += $parsedSize
                $entryCount++
                if ($entryCount -gt 8192) { throw 'Installer payload has too many members.' }
                $currentPath = $null
                $currentSize = $null
              }
              continue
            }
            if ([string]$line -clike 'Path = *') { $currentPath = ([string]$line).Substring(7); continue }
            if ([string]$line -clike 'Size = *') { $currentSize = ([string]$line).Substring(7); continue }
            if ([string]$line -clike 'Anti = +*' -or [string]$line -clike 'Symbolic Link = *' -or [string]$line -clike 'Hard Link = *') { throw 'Installer payload contains a link or anti-item.' }
          }
          if ($entryCount -eq 0) { throw 'Installer payload listing contains no members.' }
          $payloadListing | Set-Content -LiteralPath $rawPayloadList -Encoding utf8
          $payloadRoot = Join-Path $env:RUNNER_TEMP ("aster-installer-payload-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $payloadRoot) { throw 'Fresh installer payload extraction directory already exists.' }
          New-Item -ItemType Directory -Path $payloadRoot -ErrorAction Stop | Out-Null
          & $sevenZip.Source x $installer.FullName "-o$payloadRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload extraction failed.' }
          $payloadItems = @(Get-ChildItem -LiteralPath $payloadRoot -Recurse -Force)
          if (@($payloadItems | Where-Object { ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) { throw 'Extracted installer payload contains a link/reparse point.' }
          # NSIS advertises encoded patch bytes for uninstall.exe, not its
          # reconstructed executable length. Enforce actual member bounds too.
          if (@($payloadItems | Where-Object { -not $_.PSIsContainer -and $_.Length -gt 268435456 }).Count -ne 0) { throw 'Extracted installer payload member exceeds 256 MiB.' }
          $expandedBytes = @($payloadItems | Where-Object { -not $_.PSIsContainer } | Measure-Object -Property Length -Sum).Sum
          if ([long]$expandedBytes -gt 536870912) { throw 'Extracted installer payload exceeds the 512 MiB expanded-size bound.' }
          $noticeMatches = @($payloadItems | Where-Object { -not $_.PSIsContainer -and $_.Name -ceq 'THIRD-PARTY-NOTICES.txt' })
          $licenseMatches = @($payloadItems | Where-Object { -not $_.PSIsContainer -and $_.Name -ceq 'LICENSE.txt' })
          if ($noticeMatches.Count -ne 1 -or $licenseMatches.Count -ne 1) { throw 'Installer must contain exactly one notice resource and one license resource.' }
          $noticeHash = (Get-FileHash -LiteralPath reports/THIRD-PARTY-NOTICES.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          $licenseHash = (Get-FileHash -LiteralPath LICENSE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $noticeMatches[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $noticeHash) { throw 'Bundled notice resource differs from generated notice evidence.' }
          if ((Get-FileHash -LiteralPath $licenseMatches[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $licenseHash) { throw 'Bundled license resource differs from the repository license.' }
          $payloadHeader = @(
            'classification=verified-extracted-nsis-payload'
            'required_resource_count=2'
            "preflight_entry_count=$entryCount"
            "preflight_total_bytes=$preflightBytes"
            "extracted_file_bytes=$expandedBytes"
            "THIRD-PARTY-NOTICES.txt.sha256=$noticeHash"
            "LICENSE.txt.sha256=$licenseHash"
            '--- 7z listing follows ---'
          )
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'reports/installer-payload-list.txt'), $payloadHeader, $utf8NoBom)
          [System.IO.File]::AppendAllText((Join-Path $PWD 'reports/installer-payload-list.txt'), [System.IO.File]::ReadAllText($rawPayloadList), $utf8NoBom)
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected installer signature status: $($signature.Status)" }
          New-Item -ItemType Directory -Force reports/engineering-installer | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination reports/engineering-installer -ErrorAction Stop
          Copy-Item reports/THIRD-PARTY-NOTICES.txt,reports/third-party-notice-inventory.json,reports/installer-payload-list.txt -Destination reports/engineering-installer -ErrorAction Stop
          $revision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Checked-out source revision changed.' }
          $packageClassification = 'unsigned-engineering-candidate'
          if ($env:GITHUB_REF -ceq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -cin @('push', 'workflow_dispatch')) {
            $packageClassification = 'unsigned-engineering-build'
          }
          $details = [ordered]@{
            classification = $packageClassification
            workflow_ref = $env:GITHUB_REF
            workflow_event = $env:GITHUB_EVENT_NAME
            source_revision = $revision
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            filename = $installer.Name
            byte_count = $installer.Length
            sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            authenticode_status = [string]$signature.Status
            bundle_resource_sha256 = [ordered]@{
              'THIRD-PARTY-NOTICES.txt' = $noticeHash
              'LICENSE.txt' = $licenseHash
            }
            evidence_sha256 = [ordered]@{
              'THIRD-PARTY-NOTICES.txt' = (Get-FileHash reports/THIRD-PARTY-NOTICES.txt -Algorithm SHA256).Hash.ToLowerInvariant()
              'third-party-notice-inventory.json' = (Get-FileHash reports/third-party-notice-inventory.json -Algorithm SHA256).Hash.ToLowerInvariant()
              'installer-payload-list.txt' = (Get-FileHash reports/installer-payload-list.txt -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            runner = $env:RUNNER_OS
            rustc_version = (& rustc --version)
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $details | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath reports/engineering-installer/manifest.json -Encoding utf8
          Get-Content -LiteralPath reports/engineering-installer/manifest.json
      - name: Preserve synthetic attachment diagnostics even on failure
        if: ${{ always() && hashFiles('reports/attachment-worker-fixture.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attachment-worker-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/attachment-worker-fixture.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNSIGNED-engineering-aster-desktop-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/engineering-installer/
          retention-days: 14
          if-no-files-found: error
