name: Dependency inventory
on:
  push:
    branches: [maintenance/dependency-review-20261119]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Compare locked npm and Cargo versions
        run: |
          corepack enable
          corepack pnpm update @tauri-apps/api@^2.12.5 @tauri-apps/cli@^2.12.5 @testing-library/user-event@^14.6.12 jsdom@^31.0.1 vite@^8.3.8 vitest@^5.1.1 --lockfile-only
          corepack pnpm update --depth Infinity --lockfile-only
          sed -i -e 's/=0.22.1/=0.23.1/' -e 's/=0.11.0/=0.11.1/' scripts/qa/codec-fixtures/Cargo.toml
          for manifest in src-tauri/Cargo.toml scripts/qa/codec-fixtures/Cargo.toml scripts/qa/zune-unit-fixtures/Cargo.toml; do
            cargo update --manifest-path "$manifest" --verbose
          done
          git diff --check
          echo PATCH_START
          git diff --binary | gzip -c | base64
          echo PATCH_END
