name: Generate pnpm lockfile for review

# Run manually on a reviewed branch after package.json exists. It resolves a
# candidate without running dependency lifecycle scripts or writing to Git.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Resolve candidate without package scripts
        run: |
          corepack pnpm --version
          corepack pnpm install --lockfile-only --ignore-scripts
          test -s pnpm-lock.yaml
          mkdir -p reports
          printf '%s\n' "$(git rev-parse HEAD)" > reports/bootstrap-source-revision.txt
          sha256sum pnpm-lock.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-lock-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pnpm-lock.yaml
            reports/bootstrap-source-revision.txt
          retention-days: 14
          if-no-files-found: error
