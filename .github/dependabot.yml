version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns: ["react", "react-dom"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # PR #44 splits the reviewed WinRT ABI cohort. Other updates stay enabled.
    # A coordinated windows/windows-future migration needs separate review.
    ignore:
      - dependency-name: windows-future
        versions: ["0.100.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
