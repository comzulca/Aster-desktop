[package]
name = "aster-codec-source-fixtures"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.0"
publish = false
license = "Apache-2.0"

# Test-only exact-source harness. No Tauri/build script, key, host or PDF API.
[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
png = { version = "=0.18.1", default-features = false }
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
sha2 = "=0.11.0"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[dev-dependencies]
base64 = "=0.22.1"

[patch.crates-io]
zune-jpeg = { path = "../../../src-tauri/vendor/zune-jpeg-0.5.15" }
