[package]
name = "zune-jpeg"
version = "0.5.15"
edition = "2021"
rust-version = "1.97.0"
publish = false
license = "MIT OR Apache-2.0 OR Zlib"

# Test-only entry point to the exact vendored crate root. No source copy and
# no mutation of the preserved upstream Cargo.lock or production manifest.
[lib]
name = "zune_jpeg"
path = "../../../src-tauri/vendor/zune-jpeg-0.5.15/src/lib.rs"

[dependencies]
zune-core = "=0.5.3"

[features]
default = ["x86", "neon", "std"]
log = ["zune-core/log"]
neon = []
portable_simd = []
std = ["zune-core/std"]
x86 = []

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(fuzzing)"]
